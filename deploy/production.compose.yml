# Documents the stack DEPLOYED on the server. Descriptive, not meant to be run:
# the live containers were created without Compose and carry no compose labels.
# Secrets come from the environment; never commit values.
name: brainvault-production

services:
  postgres:
    image: postgres:16.14@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
    container_name: postgres-brainvault
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # published on all interfaces today, see BV-F-016
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    networks: [brainvault-net]

  n8n:
    image: n8nio/n8n:2.27.4@sha256:cf11c96b0d0089bb24459bf97b445fd7008f41543b673cce4d955f7c0ed8752d
    container_name: n8n
    restart: always
    environment:
      GENERIC_TIMEZONE: America/Mazatlan
      TZ: America/Mazatlan
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /brainvault
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    ports:
      - "5678:5678"
    volumes:
      - ${VAULT_DIR}:/brainvault
      - ${N8N_DATA_DIR}:/home/node/.n8n   # SQLite and encryption key live here, see BV-F-017
    networks: [brainvault-net]      # also attached to the default bridge network

  markitdown-api:
    image: ghcr.io/dezoito/markitdown-api@sha256:2ef83588ab1f3425263e84a013f8c3779462c2d98a2a9184b55be1f508775862
    container_name: markitdown-api
    restart: always
    ports:
      - "8490:8490"                 # no authentication, see BV-F-016
    networks: [brainvault-net]

  syncthing:
    image: syncthing/syncthing:2.1.1@sha256:775c4aac486263ca8653055bba7d3061799281974b706695e17bc798da3f4e92
    container_name: syncthing
    restart: always
    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: 0.0.0.0:8384
    ports:
      - "8384:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ${SYNCTHING_CONFIG_DIR}:/var/syncthing/config
      - ${VAULT_DIR}:/var/syncthing/brainvault
      # plus an anonymous Docker volume mounted at /var/syncthing (image default); do not delete

networks:
  brainvault-net:
    external: true
